name: GCP Maintenance

on:
  workflow_dispatch:
    inputs:
      target_env:
        type: choice
        description: "Which database to target"
        options:
          - dev
          - prod
        default: dev
      create_sql_instance:
        type: boolean
        default: false
        description: "Create Cloud SQL instance if missing"
      create_sql_db:
        type: boolean
        default: false
        description: "Create Cloud SQL database if missing"
      create_sql_user:
        type: boolean
        default: false
        description: "Create Cloud SQL user if missing"
      run_prisma_migrate:
        type: boolean
        default: true
        description: "Run Prisma migrations"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
  SQL_INSTANCE_CONNECTION: ${{ vars.CLOUDSQL_INSTANCE_CONNECTION }}
  SQL_DB: ${{ vars.CLOUDSQL_DB_DEV }}
  SQL_USER: ${{ vars.CLOUDSQL_USER }}
  DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
  DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CARD_SENSE_SA_KEY }}
          service_account: ${{ vars.CARD_SENSE_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Cloud SQL instance
        if: ${{ inputs.create_sql_instance }}
        run: |
          INSTANCE_NAME="${SQL_INSTANCE}"
          if [ -z "${INSTANCE_NAME}" ] && [ -n "${SQL_INSTANCE_CONNECTION}" ]; then
            INSTANCE_NAME="${SQL_INSTANCE_CONNECTION##*:}"
          fi
          if [ -z "${INSTANCE_NAME}" ]; then
            echo "CLOUDSQL_INSTANCE_CONNECTION or CLOUDSQL_INSTANCE is required" >&2
            exit 1
          fi
          if ! gcloud sql instances describe "${INSTANCE_NAME}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud sql instances create "${INSTANCE_NAME}" \
              --project "${PROJECT_ID}" \
              --database-version=POSTGRES_15 \
              --region "${REGION}" \
              --cpu=2 \
              --memory=4GB
          else
            echo "Cloud SQL instance ${INSTANCE_NAME} already exists"
          fi

      - name: Create Cloud SQL database
        if: ${{ inputs.create_sql_db }}
        run: |
          INSTANCE_NAME="${SQL_INSTANCE}"
          if [ -z "${INSTANCE_NAME}" ] && [ -n "${SQL_INSTANCE_CONNECTION}" ]; then
            INSTANCE_NAME="${SQL_INSTANCE_CONNECTION##*:}"
          fi
          if [ -z "${INSTANCE_NAME}" ]; then
            echo "CLOUDSQL_INSTANCE_CONNECTION or CLOUDSQL_INSTANCE is required" >&2
            exit 1
          fi
          if ! gcloud sql databases describe "${SQL_DB}" --instance "${INSTANCE_NAME}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud sql databases create "${SQL_DB}" --instance "${INSTANCE_NAME}" --project "${PROJECT_ID}"
          else
            echo "Database ${SQL_DB} already exists"
          fi

      - name: Create Cloud SQL user
        if: ${{ inputs.create_sql_user }}
        env:
          SQL_PASSWORD: ${{ secrets.CLOUDSQL_PASSWORD }}
        run: |
          if [ -z "${SQL_PASSWORD}" ]; then
            echo "CLOUDSQL_PASSWORD secret is required" >&2
            exit 1
          fi
          INSTANCE_NAME="${SQL_INSTANCE}"
          if [ -z "${INSTANCE_NAME}" ] && [ -n "${SQL_INSTANCE_CONNECTION}" ]; then
            INSTANCE_NAME="${SQL_INSTANCE_CONNECTION##*:}"
          fi
          if [ -z "${INSTANCE_NAME}" ]; then
            echo "CLOUDSQL_INSTANCE_CONNECTION or CLOUDSQL_INSTANCE is required" >&2
            exit 1
          fi
          if ! gcloud sql users list --instance "${INSTANCE_NAME}" --project "${PROJECT_ID}" --format="value(name)" | grep -q "^${SQL_USER}$"; then
            gcloud sql users create "${SQL_USER}" --instance "${INSTANCE_NAME}" --project "${PROJECT_ID}" --password "${SQL_PASSWORD}"
          else
            echo "User ${SQL_USER} already exists"
          fi

      - name: Run Prisma migrations
        if: ${{ inputs.run_prisma_migrate }}
        env:
          DATABASE_URL: ${{ inputs.target_env == 'prod' && env.DATABASE_URL_PROD || env.DATABASE_URL_DEV }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL_DEV or DATABASE_URL_PROD secret is required" >&2
            exit 1
          fi
          cd backend
          npm install
          npx prisma generate
          npx prisma migrate deploy
