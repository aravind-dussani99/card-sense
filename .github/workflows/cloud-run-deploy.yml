name: CI + Build + Deploy

on:
  pull_request:
    branches: [ main ]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: seismic-box-476911-v9
  REGION: asia-south2
  GAR_REPOSITORY: card-sense-v1
  BACKEND_SERVICE_NAME: card-sense-backend-service
  FRONTEND_SERVICE_NAME: card-sense-frontend-service
  BACKEND_SERVICE_NAME_DEV: card-sense-backend-service
  FRONTEND_SERVICE_NAME_DEV: card-sense-frontend-service
  CARD_SENSE_SA: card-sense-github-actions-sa@seismic-box-476911-v9.iam.gserviceaccount.com
  CLOUDSQL_DB_DEV: card_sense_dev
  CLOUDSQL_USER: logitrack_cloudsql_v2_user
  CLOUDSQL_INSTANCE_CONNECTION: seismic-box-476911-v9:asia-south2:logitrack-cloudsql-v2-instance
  DB_PROXY_PORT: "5432"
  CLOUDSQL_PASSWORD: ${{ secrets.CLOUDSQL_PASSWORD }}
  CORS_ORIGIN_PROD: "*"
  CORS_ORIGIN_DEV: "*"
  IMAGE_NAME_BACKEND: card-sense-backend
  IMAGE_NAME_BACKEND_PR: card-sense-backend-pr
  IMAGE_NAME_FRONTEND: card-sense-frontend
  IMAGE_NAME_FRONTEND_PR: card-sense-frontend-pr

jobs:
  detect-destructive-migrations:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      destructive: ${{ steps.detect.outputs.destructive }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard migrations vs schema changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "${BASE_SHA}" ]; then
            exit 0
          fi
          git fetch origin "${BASE_SHA}" --depth=1 || true
          SCHEMA_CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- backend/prisma/schema.prisma || true)
          MIGRATIONS_CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- backend/prisma/migrations || true)
          if [ -n "${SCHEMA_CHANGED}" ] && [ -z "${MIGRATIONS_CHANGED}" ]; then
            echo "Schema changed without a committed migration. Run prisma migrate and commit the new migration folder." >&2
            exit 1
          fi
      - name: Detect destructive migrations
        id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "${BASE_SHA}" ]; then
            echo "destructive=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git fetch origin "${BASE_SHA}" --depth=1 || true
          CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- 'backend/prisma/migrations/**/migration.sql' || true)
          if [ -z "${CHANGED}" ]; then
            echo "destructive=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          PATTERN='DROP TABLE|DROP COLUMN|DROP TYPE|ALTER TABLE[^;]*DROP|TRUNCATE'
          MATCHES=$(grep -nE "${PATTERN}" ${CHANGED} || true)
          if [ -z "${MATCHES}" ]; then
            echo "destructive=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          {
            echo "### Destructive migration review required"
            echo ""
            echo "The following migration files include destructive operations:"
            echo ""
            echo "\`\`\`"
            echo "${MATCHES}"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
          echo "destructive=true" >> $GITHUB_OUTPUT

  approve-destructive-migrations:
    runs-on: ubuntu-latest
    needs: [detect-destructive-migrations]
    if: needs.detect-destructive-migrations.outputs.destructive == 'true'
    environment: destructive-migrations
    steps:
      - name: Await approval
        run: echo "Destructive migration approval granted."

  migrate-dev:
    runs-on: ubuntu-latest
    needs: [detect-destructive-migrations]
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CARD_SENSE_SA_KEY }}
          service_account: ${{ env.CARD_SENSE_SA }}
      - name: Start Cloud SQL Proxy (dev)
        run: |
          if [ -z "${CLOUDSQL_INSTANCE_CONNECTION}" ]; then
            echo "CLOUDSQL_INSTANCE_CONNECTION is required for PR migrations" >&2
            exit 1
          fi
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${CLOUDSQL_INSTANCE_CONNECTION}" --port "${DB_PROXY_PORT}" > proxy-dev.log 2>&1 &
          sleep 3
      - name: Verify Cloud SQL Proxy (dev)
        run: |
          for i in $(seq 1 10); do
            if (echo > /dev/tcp/127.0.0.1/${DB_PROXY_PORT}) >/dev/null 2>&1; then
              echo "Cloud SQL Proxy is accepting connections on ${DB_PROXY_PORT}"
              exit 0
            fi
            echo "Waiting for Cloud SQL Proxy..."
            sleep 2
          done
          if [ -f proxy-dev.log ]; then
            echo "--- Cloud SQL Proxy (dev) log ---"
            cat proxy-dev.log
          fi
          echo "Cloud SQL Proxy did not become ready" >&2
          exit 1
      - name: Check DB connectivity (dev)
        run: |
          if [ -z "${CLOUDSQL_PASSWORD}" ]; then
            echo "CLOUDSQL_PASSWORD is required for PR migrations" >&2
            exit 1
          fi
          ENCODED_PASSWORD=$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ.get("CLOUDSQL_PASSWORD", ""), safe=""))
          PY
          )
          DATABASE_URL="postgresql://${CLOUDSQL_USER}:${ENCODED_PASSWORD}@127.0.0.1:${DB_PROXY_PORT}/${CLOUDSQL_DB_DEV}?schema=public"
          export DATABASE_URL
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL is required for PR migrations" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          import urllib.parse
          url = os.environ.get("DATABASE_URL", "")
          if url.count("@") > 1:
            print("DATABASE_URL appears to contain an unencoded '@' in the password. URL-encode it.")
            sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          userinfo = parsed.netloc.split("@")[0] if "@" in parsed.netloc else ""
          user, _, password = userinfo.partition(":")
          allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~%")
          def bad(value):
            return any(ch not in allowed for ch in value)
          if bad(user) or bad(password):
            print("DATABASE_URL contains unencoded special characters. URL-encode username/password.")
            sys.exit(1)
          PY
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          DB_URL_NO_SCHEMA="${DATABASE_URL%\?schema=public}"
          for i in $(seq 1 5); do
            if psql "${DB_URL_NO_SCHEMA}" -c "SELECT 1;" >/dev/null 2>&1; then
              echo "Database connection successful."
              exit 0
            fi
            echo "Waiting for database connection..."
            sleep 2
          done
          if [ -f proxy-dev.log ]; then
            echo "--- Cloud SQL Proxy (dev) log ---"
            cat proxy-dev.log
          fi
          psql "${DB_URL_NO_SCHEMA}" -c "SELECT 1;"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Run Prisma migrations (dev)
        working-directory: backend
        run: |
          if [ -z "${CLOUDSQL_PASSWORD}" ]; then
            echo "CLOUDSQL_PASSWORD is required for PR migrations" >&2
            exit 1
          fi
          ENCODED_PASSWORD=$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ.get("CLOUDSQL_PASSWORD", ""), safe=""))
          PY
          )
          DATABASE_URL="postgresql://${CLOUDSQL_USER}:${ENCODED_PASSWORD}@127.0.0.1:${DB_PROXY_PORT}/${CLOUDSQL_DB_DEV}?schema=public"
          export DATABASE_URL
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL is required for PR migrations" >&2
            exit 1
          fi
          if [ -z "${CLOUDSQL_INSTANCE_CONNECTION}" ]; then
            echo "CLOUDSQL_INSTANCE_CONNECTION is required for PR migrations" >&2
            exit 1
          fi
          npm install
          npx prisma generate --schema prisma/schema.postgres.prisma
          npx prisma db push --schema prisma/schema.postgres.prisma

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci --include=optional
        working-directory: frontend
      - name: Lint
        run: npm run lint --if-present
        working-directory: frontend
      - name: Format
        run: npm run format --if-present
        working-directory: frontend

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        run: npm install
        working-directory: backend
      - name: Lint
        run: npm run lint --if-present
        working-directory: backend
      - name: Format
        run: npm run format --if-present
        working-directory: backend

  build-push-deploy-backend:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      backend_url: ${{ steps.capture-backend-url.outputs.backend_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm install
        working-directory: backend

      - name: Test
        run: npm test --if-present
        working-directory: backend

      - name: Authenticate to Google Cloud (Cloud SQL)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CARD_SENSE_SA_KEY }}
          service_account: ${{ env.CARD_SENSE_SA }}

      - name: Start Cloud SQL Proxy (prod)
        env:
          CLOUDSQL_INSTANCE_CONNECTION: ${{ env.CLOUDSQL_INSTANCE_CONNECTION }}
          DB_PROXY_PORT: ${{ env.DB_PROXY_PORT }}
        run: |
          if [ -z "${CLOUDSQL_INSTANCE_CONNECTION}" ]; then
            echo "CLOUDSQL_INSTANCE_CONNECTION is required for prod migrations" >&2
            exit 1
          fi
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${CLOUDSQL_INSTANCE_CONNECTION}" --port "${DB_PROXY_PORT}" > proxy-prod.log 2>&1 &
          sleep 3
      - name: Verify Cloud SQL Proxy (prod)
        run: |
          for i in $(seq 1 10); do
            if (echo > /dev/tcp/127.0.0.1/${DB_PROXY_PORT}) >/dev/null 2>&1; then
              echo "Cloud SQL Proxy is accepting connections on ${DB_PROXY_PORT}"
              exit 0
            fi
            echo "Waiting for Cloud SQL Proxy..."
            sleep 2
          done
          if [ -f proxy-prod.log ]; then
            echo "--- Cloud SQL Proxy (prod) log ---"
            cat proxy-prod.log
          fi
          echo "Cloud SQL Proxy did not become ready" >&2
          exit 1
      - name: Check DB connectivity (prod)
        run: |
          if [ -z "${CLOUDSQL_PASSWORD}" ]; then
            echo "CLOUDSQL_PASSWORD is required for prod migrations" >&2
            exit 1
          fi
          ENCODED_PASSWORD=$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ.get("CLOUDSQL_PASSWORD", ""), safe=""))
          PY
          )
          DATABASE_URL="postgresql://${CLOUDSQL_USER}:${ENCODED_PASSWORD}@127.0.0.1:${DB_PROXY_PORT}/${CLOUDSQL_DB_DEV}?schema=public"
          export DATABASE_URL
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL is required for prod migrations" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          import urllib.parse
          url = os.environ.get("DATABASE_URL", "")
          if url.count("@") > 1:
            print("DATABASE_URL appears to contain an unencoded '@' in the password. URL-encode it.")
            sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          userinfo = parsed.netloc.split("@")[0] if "@" in parsed.netloc else ""
          user, _, password = userinfo.partition(":")
          allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~%")
          def bad(value):
            return any(ch not in allowed for ch in value)
          if bad(user) or bad(password):
            print("DATABASE_URL contains unencoded special characters. URL-encode username/password.")
            sys.exit(1)
          PY
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          DB_URL_NO_SCHEMA="${DATABASE_URL%\?schema=public}"
          for i in $(seq 1 5); do
            if psql "${DB_URL_NO_SCHEMA}" -c "SELECT 1;" >/dev/null 2>&1; then
              echo "Database connection successful."
              exit 0
            fi
            echo "Waiting for database connection..."
            sleep 2
          done
          if [ -f proxy-prod.log ]; then
            echo "--- Cloud SQL Proxy (prod) log ---"
            cat proxy-prod.log
          fi
          psql "${DB_URL_NO_SCHEMA}" -c "SELECT 1;"

      - name: Run Prisma migrations (prod)
        working-directory: backend
        run: |
          if [ -z "${CLOUDSQL_PASSWORD}" ]; then
            echo "CLOUDSQL_PASSWORD is required for prod migrations" >&2
            exit 1
          fi
          ENCODED_PASSWORD=$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ.get("CLOUDSQL_PASSWORD", ""), safe=""))
          PY
          )
          DATABASE_URL="postgresql://${CLOUDSQL_USER}:${ENCODED_PASSWORD}@127.0.0.1:${DB_PROXY_PORT}/${CLOUDSQL_DB_DEV}?schema=public"
          export DATABASE_URL
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL is required for prod migrations" >&2
            exit 1
          fi
          if [ -z "${CLOUDSQL_INSTANCE_CONNECTION}" ]; then
            echo "CLOUDSQL_INSTANCE_CONNECTION is required for prod migrations" >&2
            exit 1
          fi
          npm install
          npx prisma generate --schema prisma/schema.postgres.prisma
          npx prisma db push --schema prisma/schema.postgres.prisma

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CARD_SENSE_SA_KEY }}
          service_account: ${{ env.CARD_SENSE_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Detect backend changes (prod)
        id: backend-changes-prod
        run: |
          BASE_SHA="${{ github.event.before }}"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --prune --depth=200 origin "${BASE_SHA}"
          fi
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '^backend/|^backend\\.Dockerfile|^backend/Dockerfile' || true)
          if [ -n "${CHANGED}" ]; then
            echo "backend_changed=true" >> $GITHUB_OUTPUT
          else
            echo "backend_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check existing backend image (prod)
        id: backend-image-prod
        run: |
          IMAGE_URI=$(gcloud artifacts docker images list "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME_BACKEND}" --format="value(IMAGE)" --limit=1 --sort-by=~UPDATE_TIME)
          if [ -n "${IMAGE_URI}" ]; then
            echo "image_exists=true" >> $GITHUB_OUTPUT
            echo "latest_image=${IMAGE_URI}" >> $GITHUB_OUTPUT
          else
            echo "image_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure GAR repository
        run: |
          if ! gcloud artifacts repositories describe "${GAR_REPOSITORY}" --location "${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${GAR_REPOSITORY}" \
              --location "${REGION}" \
              --repository-format docker \
              --description "Docker repository for Card Sense"
          fi

      - name: Build and Push Backend Image (prod)
        if: steps.backend-changes-prod.outputs.backend_changed == 'true' || steps.backend-image-prod.outputs.image_exists != 'true'
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME_BACKEND}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker build -t "${IMAGE_URI}" ./backend
          docker push "${IMAGE_URI}"

      - name: Use Latest Backend Image (prod)
        if: steps.backend-changes-prod.outputs.backend_changed != 'true' && steps.backend-image-prod.outputs.image_exists == 'true'
        run: |
          echo "IMAGE_URI=${{ steps.backend-image-prod.outputs.latest_image }}" >> $GITHUB_ENV

      - name: Deploy Backend to Cloud Run
        env:
          ADMIN_RESET_TOKEN: ${{ secrets.ADMIN_RESET_TOKEN_PROD }}
        run: |
          if [ -z "${CLOUDSQL_PASSWORD}" ]; then
            echo "CLOUDSQL_PASSWORD is required for prod deployments" >&2
            exit 1
          fi
          ENCODED_PASSWORD=$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ.get("CLOUDSQL_PASSWORD", ""), safe=""))
          PY
          )
          DATABASE_URL="postgresql://${CLOUDSQL_USER}:${ENCODED_PASSWORD}@localhost:${DB_PROXY_PORT}/${CLOUDSQL_DB_DEV}?schema=public&host=/cloudsql/${CLOUDSQL_INSTANCE_CONNECTION}"
          export DATABASE_URL
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL is required for prod deployments" >&2
            exit 1
          fi
          if [ -z "${ADMIN_RESET_TOKEN}" ]; then
            echo "ADMIN_RESET_TOKEN_PROD secret is required for prod deployments" >&2
            exit 1
          fi
          if [ -z "${CARD_SENSE_SA}" ]; then
            echo "CARD_SENSE_SA is required to set the Cloud Run runtime service account" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse, parse_qs

          url = os.environ.get("DATABASE_URL", "")
          parsed = urlparse(url)
          if not parsed.hostname:
            print("DATABASE_URL is missing a host. Use localhost for Prisma compatibility.")
            sys.exit(1)
          qs = parse_qs(parsed.query)
          if "host" not in qs:
            print("DATABASE_URL is missing host=/cloudsql/INSTANCE in query params.")
            sys.exit(1)
          PY
          gcloud run deploy "${BACKEND_SERVICE_NAME}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --service-account "${CARD_SENSE_SA}" \
            --port 8080 \
            --add-cloudsql-instances "${CLOUDSQL_INSTANCE_CONNECTION}" \
            --set-env-vars "CORS_ORIGIN=${CORS_ORIGIN_PROD},DATABASE_URL=${DATABASE_URL},ADMIN_RESET_TOKEN=${ADMIN_RESET_TOKEN}" \
            --allow-unauthenticated

      - name: Capture Backend URL (prod)
        id: capture-backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe "${BACKEND_SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)')
          echo "backend_url=${BACKEND_URL}" >> $GITHUB_OUTPUT

  build-push-deploy-backend-dev:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, migrate-dev]
    if: false
    outputs:
      backend_url: ${{ steps.capture-backend-url.outputs.backend_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate dev deployment config
        run: |
          if [ -z "${BACKEND_SERVICE_NAME_DEV}" ]; then
            echo "CLOUD_RUN_BACKEND_SERVICE_DEV is required for PR deployments" >&2
            exit 1
          fi
          if [ -z "${CORS_ORIGIN_DEV}" ]; then
            echo "CORS_ORIGIN_DEV is required for PR deployments" >&2
            exit 1
          fi

      - name: Install Dependencies
        run: npm install
        working-directory: backend

      - name: Test
        run: npm test --if-present
        working-directory: backend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CARD_SENSE_SA_KEY }}
          service_account: ${{ env.CARD_SENSE_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Detect backend changes (dev)
        id: backend-changes-dev
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --prune --depth=200 origin "${BASE_SHA}"
          fi
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -E '^backend/|^backend\\.Dockerfile|^backend/Dockerfile' || true)
          if [ -n "${CHANGED}" ]; then
            echo "backend_changed=true" >> $GITHUB_OUTPUT
          else
            echo "backend_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check existing backend image (dev)
        id: backend-image-dev
        run: |
          IMAGE_URI=$(gcloud artifacts docker images list "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME_BACKEND_PR}" --format="value(IMAGE)" --limit=1 --sort-by=~UPDATE_TIME)
          if [ -n "${IMAGE_URI}" ]; then
            echo "image_exists=true" >> $GITHUB_OUTPUT
            echo "latest_image=${IMAGE_URI}" >> $GITHUB_OUTPUT
          else
            echo "image_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure GAR repository
        run: |
          if ! gcloud artifacts repositories describe "${GAR_REPOSITORY}" --location "${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${GAR_REPOSITORY}" \
              --location "${REGION}" \
              --repository-format docker \
              --description "Docker repository for Card Sense"
          fi

      - name: Build and Push Backend Image (dev)
        if: steps.backend-changes-dev.outputs.backend_changed == 'true' || steps.backend-image-dev.outputs.image_exists != 'true'
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME_BACKEND_PR}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker build -t "${IMAGE_URI}" ./backend
          docker push "${IMAGE_URI}"

      - name: Use Latest Backend Image (dev)
        if: steps.backend-changes-dev.outputs.backend_changed != 'true' && steps.backend-image-dev.outputs.image_exists == 'true'
        run: |
          echo "IMAGE_URI=${{ steps.backend-image-dev.outputs.latest_image }}" >> $GITHUB_ENV

      - name: Deploy Backend to Cloud Run (dev)
        env:
          ADMIN_RESET_TOKEN: ${{ secrets.ADMIN_RESET_TOKEN_DEV }}
        run: |
          if [ -z "${CLOUDSQL_PASSWORD}" ]; then
            echo "CLOUDSQL_PASSWORD is required for PR deployments" >&2
            exit 1
          fi
          ENCODED_PASSWORD=$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ.get("CLOUDSQL_PASSWORD", ""), safe=""))
          PY
          )
          DATABASE_URL="postgresql://${CLOUDSQL_USER}:${ENCODED_PASSWORD}@localhost:${DB_PROXY_PORT}/${CLOUDSQL_DB_DEV}?schema=public&host=/cloudsql/${CLOUDSQL_INSTANCE_CONNECTION}"
          export DATABASE_URL
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL is required for PR deployments" >&2
            exit 1
          fi
          if [ -z "${ADMIN_RESET_TOKEN}" ]; then
            echo "ADMIN_RESET_TOKEN_DEV secret is required for PR deployments" >&2
            exit 1
          fi
          if [ -z "${CARD_SENSE_SA}" ]; then
            echo "CARD_SENSE_SA is required to set the Cloud Run runtime service account" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse, parse_qs

          url = os.environ.get("DATABASE_URL", "")
          parsed = urlparse(url)
          if not parsed.hostname:
            print("DATABASE_URL is missing a host. Use localhost for Prisma compatibility.")
            sys.exit(1)
          qs = parse_qs(parsed.query)
          if "host" not in qs:
            print("DATABASE_URL is missing host=/cloudsql/INSTANCE in query params.")
            sys.exit(1)
          PY
          gcloud run deploy "${BACKEND_SERVICE_NAME_DEV}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --service-account "${CARD_SENSE_SA}" \
            --port 8080 \
            --add-cloudsql-instances "${CLOUDSQL_INSTANCE_CONNECTION}" \
            --set-env-vars "CORS_ORIGIN=${CORS_ORIGIN_DEV},DATABASE_URL=${DATABASE_URL},ADMIN_RESET_TOKEN=${ADMIN_RESET_TOKEN}" \
            --allow-unauthenticated

      - name: Capture Backend URL (dev)
        id: capture-backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe "${BACKEND_SERVICE_NAME_DEV}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)')
          echo "backend_url=${BACKEND_URL}" >> $GITHUB_OUTPUT

  build-deploy-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, build-push-deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend changes (prod)
        id: frontend-changes-prod
        run: |
          BASE_SHA="${{ github.event.before }}"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --prune --depth=200 origin "${BASE_SHA}"
          fi
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '^frontend/' || true)
          if [ -n "${CHANGED}" ]; then
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CARD_SENSE_SA_KEY }}
          service_account: ${{ env.CARD_SENSE_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Check existing frontend image (prod)
        id: frontend-image-prod
        run: |
          IMAGE_URI=$(gcloud artifacts docker images list "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME_FRONTEND}" --format="value(IMAGE)" --limit=1 --sort-by=~UPDATE_TIME)
          if [ -n "${IMAGE_URI}" ]; then
            echo "image_exists=true" >> $GITHUB_OUTPUT
            echo "latest_image=${IMAGE_URI}" >> $GITHUB_OUTPUT
          else
            echo "image_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure GAR repository
        run: |
          if ! gcloud artifacts repositories describe "${GAR_REPOSITORY}" --location "${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${GAR_REPOSITORY}" \
              --location "${REGION}" \
              --repository-format docker \
              --description "Docker repository for Card Sense"
          fi

      - name: Build and Push Frontend Image (prod)
        if: steps.frontend-changes-prod.outputs.frontend_changed == 'true' || steps.frontend-image-prod.outputs.image_exists != 'true'
        run: |
          BACKEND_URL="${{ needs.build-push-deploy-backend.outputs.backend_url }}"
          if [ -z "${BACKEND_URL}" ]; then
            echo "Backend URL is required for frontend build" >&2
            exit 1
          fi
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME_FRONTEND}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${BACKEND_URL}" \
            -t "${IMAGE_URI}" \
            ./frontend
          docker push "${IMAGE_URI}"

      - name: Use Latest Frontend Image (prod)
        if: steps.frontend-changes-prod.outputs.frontend_changed != 'true' && steps.frontend-image-prod.outputs.image_exists == 'true'
        run: |
          echo "IMAGE_URI=${{ steps.frontend-image-prod.outputs.latest_image }}" >> $GITHUB_ENV

      - name: Deploy Frontend to Cloud Run (prod)
        run: |
          if [ -z "${FRONTEND_SERVICE_NAME}" ]; then
            echo "CLOUD_RUN_FRONTEND_SERVICE is required for prod deployments" >&2
            exit 1
          fi
          gcloud run deploy "${FRONTEND_SERVICE_NAME}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --service-account "${CARD_SENSE_SA}" \
            --port 8080 \
            --allow-unauthenticated

  build-deploy-frontend-dev:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, migrate-dev, build-push-deploy-backend-dev]
    if: false
